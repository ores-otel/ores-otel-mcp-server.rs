name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.95.0", "1.97.1"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component clippy,rustfmt
      - name: Reject credential-like tracked content
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- . ':!Cargo.lock'; then
            echo 'credential-like tracked content detected' >&2
            exit 1
          fi
      - name: Check formatting
        run: rustup run "${{ matrix.rust }}" cargo fmt --all --check
      - name: Lint
        run: rustup run "${{ matrix.rust }}" cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test protocol and security boundaries
        run: rustup run "${{ matrix.rust }}" cargo test --locked --all-targets --all-features
      - name: Build release
        run: rustup run "${{ matrix.rust }}" cargo build --locked --release --all-features
      - name: Install pinned RustSec scanner
        if: matrix.rust == '1.95.0'
        run: rustup run "${{ matrix.rust }}" cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        if: matrix.rust == '1.95.0'
        run: rustup run "${{ matrix.rust }}" cargo audit --deny warnings
